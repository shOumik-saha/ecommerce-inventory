openapi: 3.0.3
info:
  title: Ecommerce Inventory API
  version: 1.0.0
  description: |
    REST API for inventory management (authentication, products, categories).
    JWT Bearer token is required for protected routes.
servers:
  - url: http://localhost:8000/api
    description: Local
  - url: https://ecommerce-inventory-production.up.railway.app/api
    description: Production
tags:
  - name: Auth
  - name: Products
  - name: Categories

paths:
  /register:
    post:
      tags: [Auth]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                  example: Shoumik Saha
                email:
                  type: string
                  format: email
                  example: shoumik@example.com
                password:
                  type: string
                  minLength: 6
                  example: secret123
                password_confirmation:
                  type: string
                  minLength: 6
                  example: secret123
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: shoumik@example.com
                password:
                  type: string
                  example: secret123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid credentials

  /me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /refresh:
    post:
      tags: [Auth]
      summary: Refresh JWT token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOi...
        "401":
          $ref: "#/components/responses/Unauthorized"

  /logout:
    post:
      tags: [Auth]
      summary: Logout user (invalidate token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Successfully logged out
        "401":
          $ref: "#/components/responses/Unauthorized"

  /products:
    get:
      tags: [Products]
      summary: List products (paginated)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          example: 1
        - in: query
          name: category
          schema:
            type: integer
          description: Category ID
        - in: query
          name: min_price
          schema:
            type: number
            format: float
        - in: query
          name: max_price
          schema:
            type: number
            format: float
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProductPagination"

    post:
      tags: [Products]
      summary: Create product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /products/search:
    get:
      tags: [Products]
      summary: Search products by query
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          example: iphone
      responses:
        "200":
          description: Search result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/ProductPagination"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
        "404":
          description: Not found

    put:
      tags: [Products]
      summary: Update product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product not found
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    delete:
      tags: [Products]
      summary: Delete product
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found

  /categories:
    get:
      tags: [Categories]
      summary: List categories (paginated)
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Category page
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CategoryPagination"

    post:
      tags: [Categories]
      summary: Create category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Category detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Category"
                      - type: object
                        properties:
                          products:
                            type: array
                            items:
                              $ref: "#/components/schemas/Product"
        "404":
          description: Not found

    put:
      tags: [Categories]
      summary: Update category
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Category"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    delete:
      tags: [Categories]
      summary: Delete category
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Category deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Shoumik Saha
        email:
          type: string
          format: email
          example: shoumik@example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Electronics
        description:
          type: string
          nullable: true
          example: Electronic devices
        products_count:
          type: integer
          nullable: true
          example: 3
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: iPhone 15
        description:
          type: string
          nullable: true
          example: Latest iPhone model
        price:
          type: string
          example: "999.99"
        stock:
          type: integer
          example: 50
        category_id:
          type: integer
          example: 1
        image_url:
          type: string
          nullable: true
          example: null
        category:
          $ref: "#/components/schemas/Category"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProductCreateRequest:
      type: object
      required: [name, price, stock, category_id]
      properties:
        name:
          type: string
          example: iPhone 15
        description:
          type: string
          nullable: true
          example: Latest iPhone model
        price:
          type: number
          format: float
          example: 999.99
        stock:
          type: integer
          minimum: 0
          example: 50
        category_id:
          type: integer
          example: 1

    ProductUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: iPhone 15 Pro
        description:
          type: string
          nullable: true
        price:
          type: number
          format: float
          example: 1099.99
        stock:
          type: integer
          minimum: 0
          example: 40
        category_id:
          type: integer
          example: 1

    CategoryCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Electronics
        description:
          type: string
          nullable: true
          example: Electronic devices

    CategoryUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Electronics
        description:
          type: string
          nullable: true
          example: Electronic devices and accessories

    PaginationLinks:
      type: array
      items:
        type: object
        properties:
          url:
            type: string
            nullable: true
          label:
            type: string
          page:
            type: integer
            nullable: true
          active:
            type: boolean

    ProductPagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        first_page_url:
          type: string
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          $ref: "#/components/schemas/PaginationLinks"
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          oneOf:
            - type: integer
            - type: string
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer
          example: 3

    CategoryPagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        first_page_url:
          type: string
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          $ref: "#/components/schemas/PaginationLinks"
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          oneOf:
            - type: integer
            - type: string
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer
          example: 2

    AuthSuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          nullable: true
          example: User registered successfully
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          example: eyJ0eXAiOiJKV1QiLCJhbGciOi...

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
